name: Collect NFL board
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: nfl-board-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: iphone-week1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Collect verified board
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector.py
